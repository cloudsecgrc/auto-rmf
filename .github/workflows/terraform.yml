name: AUTO-RMF Terraform CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  TF_VERSION: '1.5.0'
  AWS_REGION: 'us-east-1'
  
  # Inject GitHub Secrets as Terraform variables
  TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
  TF_VAR_management_account_id: ${{ secrets.AWS_MANAGEMENT_ACCOUNT_ID }}
  TF_VAR_logging_account_id: ${{ secrets.AWS_LOGGING_ACCOUNT_ID }}
  TF_VAR_security_account_id: ${{ secrets.AWS_SECURITY_ACCOUNT_ID }}
  TF_VAR_workload_account_id: ${{ secrets.AWS_WORKLOAD_ACCOUNT_ID }}
  TF_VAR_organization_id: ${{ secrets.AWS_ORGANIZATION_ID }}
  TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
  
  # OIDC Role ARNs (constructed from secrets)
  MANAGEMENT_ROLE_ARN: arn:aws:iam::${{ secrets.AWS_MANAGEMENT_ACCOUNT_ID }}:role/GithubConnect
  LOGGING_ROLE_ARN: arn:aws:iam::${{ secrets.AWS_LOGGING_ACCOUNT_ID }}:role/GithubConnect
  SECURITY_ROLE_ARN: arn:aws:iam::${{ secrets.AWS_SECURITY_ACCOUNT_ID }}:role/GithubConnect
  WORKLOAD_ROLE_ARN: arn:aws:iam::${{ secrets.AWS_WORKLOAD_ACCOUNT_ID }}:role/GithubConnect

permissions:
  id-token: write
  contents: read

jobs:
  ##############################################
  ########## VALIDATION & SECURITY #############
  ##############################################
  
  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    strategy:
      matrix:
        account: [logging, management, security, workload]
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        working-directory: accounts/${{ matrix.account }}
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: accounts/${{ matrix.account }}
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: accounts/${{ matrix.account }}
        run: terraform validate

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          soft_fail: true

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          soft_fail: true

  ##############################################
  ############### PLAN (PR ONLY) ###############
  ##############################################
  
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        account: [logging, management, security, workload]
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Set Role ARN
        id: set-role
        run: |
          case ${{ matrix.account }} in
            management) echo "role_arn=${{ env.MANAGEMENT_ROLE_ARN }}" >> $GITHUB_OUTPUT ;;
            logging) echo "role_arn=${{ env.LOGGING_ROLE_ARN }}" >> $GITHUB_OUTPUT ;;
            security) echo "role_arn=${{ env.SECURITY_ROLE_ARN }}" >> $GITHUB_OUTPUT ;;
            workload) echo "role_arn=${{ env.WORKLOAD_ROLE_ARN }}" >> $GITHUB_OUTPUT ;;
          esac

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ steps.set-role.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: accounts/${{ matrix.account }}
        run: terraform init

      - name: Terraform Plan
        working-directory: accounts/${{ matrix.account }}
        run: terraform plan -no-color

  ##############################################
  ########## APPLY (MAIN BRANCH ONLY) ##########
  ##############################################
  
  apply-logging:
    name: Apply Logging Account
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ env.LOGGING_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: accounts/logging
        run: terraform init

      - name: Terraform Apply
        id: apply
        working-directory: accounts/logging
        run: terraform apply -auto-approve
        continue-on-error: true

      - name: Cleanup on Failure
        if: steps.apply.outcome == 'failure'
        working-directory: accounts/logging
        run: |
          echo "Attempting to release any stuck state locks..."
          terraform force-unlock -force $(terraform force-unlock 2>&1 | grep -oP '(?<=ID: )[a-f0-9-]+' | head -1) || true

      - name: Fail Job if Apply Failed
        if: steps.apply.outcome == 'failure'
        run: exit 1

  apply-management:
    name: Apply Management Account
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: apply-logging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ env.MANAGEMENT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: accounts/management
        run: terraform init

      - name: Terraform Apply
        id: apply
        working-directory: accounts/management
        run: terraform apply -auto-approve
        continue-on-error: true

      - name: Cleanup on Failure
        if: steps.apply.outcome == 'failure'
        working-directory: accounts/management
        run: |
          echo "Attempting to release any stuck state locks..."
          terraform force-unlock -force $(terraform force-unlock 2>&1 | grep -oP '(?<=ID: )[a-f0-9-]+' | head -1) || true

      - name: Fail Job if Apply Failed
        if: steps.apply.outcome == 'failure'
        run: exit 1

  apply-security:
    name: Apply Security Account
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: apply-management
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ env.SECURITY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: accounts/security
        run: terraform init

      - name: Terraform Apply
        id: apply
        working-directory: accounts/security
        run: terraform apply -auto-approve
        continue-on-error: true

      - name: Cleanup on Failure
        if: steps.apply.outcome == 'failure'
        working-directory: accounts/security
        run: |
          echo "Attempting to release any stuck state locks..."
          terraform force-unlock -force $(terraform force-unlock 2>&1 | grep -oP '(?<=ID: )[a-f0-9-]+' | head -1) || true

      - name: Fail Job if Apply Failed
        if: steps.apply.outcome == 'failure'
        run: exit 1

  apply-workload:
    name: Apply Workload Account
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: apply-security
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ env.WORKLOAD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: accounts/workload
        run: terraform init

      - name: Terraform Apply
        id: apply
        working-directory: accounts/workload
        run: terraform apply -auto-approve
        continue-on-error: true

      - name: Cleanup on Failure
        if: steps.apply.outcome == 'failure'
        working-directory: accounts/workload
        run: |
          echo "Attempting to release any stuck state locks..."
          terraform force-unlock -force $(terraform force-unlock 2>&1 | grep -oP '(?<=ID: )[a-f0-9-]+' | head -1) || true

      - name: Fail Job if Apply Failed
        if: steps.apply.outcome == 'failure'
        run: exit 1

  ##############################################
  ############ DEPLOYMENT SUMMARY ##############
  ##############################################
  
  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [apply-logging, apply-management, apply-security, apply-workload]
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Summary
        run: |
          echo "### AUTO-RMF Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment Order:**" >> $GITHUB_STEP_SUMMARY
          echo "1. ✅ Logging Account (centralized log storage)" >> $GITHUB_STEP_SUMMARY
          echo "2. ✅ Management Account (org trail, delegations)" >> $GITHUB_STEP_SUMMARY
          echo "3. ✅ Security Account (aggregator, Lambda)" >> $GITHUB_STEP_SUMMARY
          echo "4. ✅ Workload Account (application resources)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Architecture:**" >> $GITHUB_STEP_SUMMARY
          echo "- Management: CloudTrail org trail, delegations, SCPs" >> $GITHUB_STEP_SUMMARY
          echo "- Logging: S3 buckets for all logs" >> $GITHUB_STEP_SUMMARY
          echo "- Security: Config aggregator, Lambda evidence collector" >> $GITHUB_STEP_SUMMARY
          echo "- Workload: Application infrastructure" >> $GITHUB_STEP_SUMMARY
