name: AUTO-RMF Terraform CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  TF_VERSION: '1.5.0'
  AWS_REGION: 'us-east-1'
  MANAGEMENT_ROLE_ARN: 'arn:aws:iam::995761092254:role/GithubConnect'
  LOGGING_ROLE_ARN: 'arn:aws:iam::195835300931:role/GithubConnect'
  SECURITY_ROLE_ARN: 'arn:aws:iam::918595517273:role/GithubConnect'
  WORKLOAD_ROLE_ARN: 'arn:aws:iam::507991607232:role/GithubConnect'

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    strategy:
      matrix:
        account: [management, logging, security, workload]
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        working-directory: accounts/${{ matrix.account }}
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: accounts/${{ matrix.account }}
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: accounts/${{ matrix.account }}
        run: terraform validate

  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        account: [management, logging, security, workload]
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Set Role ARN
        id: set-role
        run: |
         case ${{ matrix.account }} in
            management) echo "role_arn=${{ env.MANAGEMENT_ROLE_ARN }}" >> $GITHUB_OUTPUT ;;
            logging) echo "role_arn=${{ env.LOGGING_ROLE_ARN }}" >> $GITHUB_OUTPUT ;;
            security) echo "role_arn=${{ env.SECURITY_ROLE_ARN }}" >> $GITHUB_OUTPUT ;;
            workload) echo "role_arn=${{ env.WORKLOAD_ROLE_ARN }}" >> $GITHUB_OUTPUT ;;
          esac 
          
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ steps.set-role.outputs.role.arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: accounts/${{ matrix.account }}
        run: terraform init

      - name: Terraform Plan
        working-directory: accounts/${{ matrix.account }}
        run: terraform plan -no-color

  apply-logging:
    name: Apply Logging
    runs-on: ubuntu-latest
    needs: apply-management
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ env.LOGGING_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: accounts/logging
        run: terraform init

      - name: Terraform Apply
        working-directory: accounts/logging
        run: terraform apply -auto-approve

  apply-management:
    name: Apply Management
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ env.MANAGEMENT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: accounts/management
        run: terraform init

      - name: Import GuardDuty Delegation
        working-directory: accounts/management
        run: |
          terraform import aws_guardduty_organization_admin_account.security 918595517273 || true
        continue-on-error: true

      - name: Terraform Apply
        working-directory: accounts/management
        run: terraform apply -auto-approve

  apply-security:
    name: Apply Security
    runs-on: ubuntu-latest
    needs: apply-logging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ env.SECURITY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: accounts/security
        run: terraform init

      - name: Terraform Apply
        working-directory: accounts/security
        run: terraform apply -auto-approve

  apply-workload:
    name: Apply Workload
    runs-on: ubuntu-latest
    needs: apply-security
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ env.WORKLOAD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: accounts/workload
        run: terraform init

      - name: Terraform Apply
        working-directory: accounts/workload
        run: terraform apply -auto-approve

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          soft_fail: true

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          soft_fail: true
