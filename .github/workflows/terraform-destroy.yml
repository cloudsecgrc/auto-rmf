name: AUTO-RMF Terraform Destroy


on:
  workflow_dispatch:  # Manual trigger only
    inputs:
      confirm:
        description: 'Type "destroy" to confirm'
        required: true
        default: ''

env:
  TF_VERSION: '1.5.0'
  AWS_REGION: 'us-east-1'
  
  TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
  TF_VAR_management_account_id: ${{ secrets.AWS_MANAGEMENT_ACCOUNT_ID }}
  TF_VAR_logging_account_id: ${{ secrets.AWS_LOGGING_ACCOUNT_ID }}
  TF_VAR_security_account_id: ${{ secrets.AWS_SECURITY_ACCOUNT_ID }}
  TF_VAR_workload_account_id: ${{ secrets.AWS_WORKLOAD_ACCOUNT_ID }}
  TF_VAR_organization_id: ${{ secrets.AWS_ORGANIZATION_ID }}
  TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
  
  MANAGEMENT_ROLE_ARN: arn:aws:iam::${{ secrets.AWS_MANAGEMENT_ACCOUNT_ID }}:role/GithubConnect
  LOGGING_ROLE_ARN: arn:aws:iam::${{ secrets.AWS_LOGGING_ACCOUNT_ID }}:role/GithubConnect
  SECURITY_ROLE_ARN: arn:aws:iam::${{ secrets.AWS_SECURITY_ACCOUNT_ID }}:role/GithubConnect
  WORKLOAD_ROLE_ARN: arn:aws:iam::${{ secrets.AWS_WORKLOAD_ACCOUNT_ID }}:role/GithubConnect

permissions:
  id-token: write
  contents: read

jobs:
  confirm:
    name: Confirm Destruction
    runs-on: ubuntu-latest
    steps:
      - name: Check Confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "destroy" ]; then
            echo "Confirmation failed. You must type 'destroy' to proceed."
            exit 1
          fi
          echo "Confirmation received. Proceeding with destruction..."

  destroy-workload:
    name: Destroy Workload Account
    runs-on: ubuntu-latest
    needs: confirm
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ env.WORKLOAD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: accounts/workload
        run: terraform init

      - name: Terraform Destroy
        working-directory: accounts/workload
        run: terraform destroy -auto-approve

  destroy-security:
    name: Destroy Security Account
    runs-on: ubuntu-latest
    needs: destroy-workload
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ env.SECURITY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: accounts/security
        run: terraform init

      - name: Terraform Destroy
        working-directory: accounts/security
        run: terraform destroy -auto-approve

  destroy-management:
    name: Destroy Management Account
    runs-on: ubuntu-latest
    needs: destroy-security
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ env.MANAGEMENT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: accounts/management
        run: terraform init

      - name: Terraform Destroy
        working-directory: accounts/management
        run: terraform destroy -auto-approve

  destroy-logging:
    name: Destroy Logging Account
    runs-on: ubuntu-latest
    needs: destroy-management
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ env.LOGGING_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: accounts/logging
        run: terraform init

      - name: Terraform Destroy
        working-directory: accounts/logging
        run: terraform destroy -auto-approve
